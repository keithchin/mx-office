name: Release

# Every change to the app that lands on main is built, tested and published as a GitHub release,
# and install.sh installs the newest one. The version is package.json's major.minor plus the
# number of commits on main (v0.1.68, v0.1.69, ...); bump package.json for a new minor.
#
# Pull requests get the same build, tests and a real install of the packed release through
# install.sh, but publish nothing.
#
# The perf job runs the performance guard's quick check (npm run test:perf:quick: the main views on a
# big test office in headless Chromium, the journey, a minute of the busy office; fake agents only)
# against the unchanged budgets. Its pass or fail is the guard's own: a browser that can't launch, or a
# budget missed, fails it. Its result.json, summary.md and screenshots are uploaded every time. It
# runs beside the release job and doesn't hold up publishing, but a failure makes the run red.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'install.sh'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'install.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run typecheck

      - run: npm test

      - name: Pack the release
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          npm version "$version" --no-git-tag-version --allow-same-version
          # It's built already, and installs don't have the build tools.
          npm pkg delete scripts.prepare
          # Installs get exactly the dependency versions tested here.
          cp package-lock.json npm-shrinkwrap.json
          npm pkg set 'files[]=npm-shrinkwrap.json'
          npm pack --ignore-scripts
          mv "agent-office-$version.tgz" agent-office.tgz
          tar -tzf agent-office.tgz | grep -qx 'package/npm-shrinkwrap.json'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install it with install.sh and start it
        env:
          AGENT_OFFICE_TARBALL: ${{ github.workspace }}/agent-office.tgz
          AGENT_OFFICE_INSTALL_DIR: ${{ runner.temp }}/install
          AGENT_OFFICE_BIN_DIR: ${{ runner.temp }}/bin
          AGENT_OFFICE_HOME: ${{ runner.temp }}/office
          AGENT_OFFICE_INSTALL_ONLY: '1'
        run: |
          bash install.sh
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bin/agent-office" --host 127.0.0.1 --port 4700 --password ci > office.log 2>&1 &
          office=$!
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/login.html || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the installed office didn't answer (last status: $code)"; exit 1; }
          grep -qx "v${{ steps.pack.outputs.version }}" install/current
          kill -INT "$office"

      - name: Publish
        # Only the original repository publishes releases; a fork (ours, keithchin/mx-office) builds and tests and stops here.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'AgentSystemLabs/agent-office'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pack.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" agent-office.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - name: Install Chromium for the repository's playwright-core
        # playwright-core's own CLI, so the browser is the build that version expects (package-lock.json
        # pins it); --with-deps adds the system libraries it needs on the runner.
        run: |
          npx --no-install playwright-core --version
          npx --no-install playwright-core install --with-deps chromium

      - name: Check that the browser launches (blocks the guard if it can't)
        # The same Chromium the guard uses (scripts/perf/pages.mjs findChrome: the full browser, not the headless shell).
        run: |
          node --input-type=module -e "
            import { chromium } from 'playwright-core';
            import { findChrome } from './scripts/perf/pages.mjs';
            const exe = findChrome();
            if (!exe) { console.error('BLOCKED: no Chromium from playwright-core install, so the performance guard cannot run'); process.exit(1); }
            try {
              const b = await chromium.launch({ headless: true, executablePath: exe });
              console.log('Chromium', b.version(), 'launches from', exe);
              await b.close();
            } catch (e) {
              console.error('BLOCKED: headless Chromium did not launch, so the performance guard cannot run:', e.message);
              process.exit(1);
            }
          " browser-check

      - name: Performance guard (quick)
        env:
          # The guard's throwaway test offices, and its results under results/<run id>/.
          AGENT_OFFICE_TEST_OFFICES: ${{ runner.temp }}/test-offices
        run: |
          mkdir -p "$AGENT_OFFICE_TEST_OFFICES"
          npm run test:perf:quick

      - name: Performance guard summary
        if: always()
        env:
          AGENT_OFFICE_TEST_OFFICES: ${{ runner.temp }}/test-offices
        run: |
          shopt -s nullglob
          files=("$AGENT_OFFICE_TEST_OFFICES"/results/*/summary.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "The performance guard wrote no summary (it didn't get as far as running)." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in "$AGENT_OFFICE_TEST_OFFICES"/results/*/result.json; do
            node -e "const r = require(process.argv[1]); console.log((r.ok ? 'PASS' : 'FAIL') + ': ' + r.suite + (r.error ? ' (' + r.error + ')' : '')); for (const x of r.failures ?? []) console.log('  - ' + x);" "$f"
          done

      - name: Upload the performance guard's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-guard-results
          path: |
            ${{ runner.temp }}/test-offices/results/**/result.json
            ${{ runner.temp }}/test-offices/results/**/summary.md
            ${{ runner.temp }}/test-offices/results/**/*.png
          if-no-files-found: warn
          retention-days: 30
