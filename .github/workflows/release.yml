name: Release

# Every change to the app that lands on main is built and tested, and the built tree is started the
# way the launcher starts it (node bin/agent-office.js, in test mode, on a throwaway office home) to
# check that it really starts; the launcher's own plan (scripts/start-office.ps1 -DryRun) is checked
# under pwsh too. Nothing is published: Mx Office installs by cloning and building, and releases are
# made by hand (see CHANGELOG.md). Pull requests get the same run.
#
# The perf job runs the performance guard's quick check (npm run test:perf:quick: the main views on a
# big test office in headless Chromium, the journey, a minute of the busy office; fake agents only)
# against the unchanged budgets. Its pass or fail is the guard's own: a browser that can't launch, or a
# budget missed, fails it. Its result.json, summary.md and screenshots are uploaded every time. It
# runs beside the release job, and a failure makes the run red.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run typecheck

      - run: npm test

      - name: Start the built office and check it answers
        env:
          AGENT_OFFICE_HOME: ${{ runner.temp }}/office
        run: |
          mkdir -p "$AGENT_OFFICE_HOME"
          # Test mode: no real agent CLI can start. A fresh office home has no projects anyway.
          node bin/agent-office.js --host 127.0.0.1 --port 4700 --password ci --no-open --test-mode > "$RUNNER_TEMP/office.log" 2>&1 &
          office=$!
          code=000
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/login.html || true)
            [ "$code" = 200 ] && break
            kill -0 "$office" 2>/dev/null || break
            sleep 1
          done
          # Ctrl+C stops it (and its terminal host); give it 15 s, then make sure.
          kill -INT "$office" 2>/dev/null || true
          for _ in $(seq 15); do kill -0 "$office" 2>/dev/null || break; sleep 1; done
          kill -KILL "$office" 2>/dev/null || true
          if [ "$code" != 200 ]; then
            cat "$RUNNER_TEMP/office.log"
            echo "the built office didn't answer on /login.html (last status: $code)"
            exit 1
          fi
          echo "the built office answered 200 on /login.html"

      - name: Check the launcher's plan (start-office.ps1 -DryRun)
        shell: pwsh
        run: |
          $out = ./scripts/start-office.ps1 -DryRun -NoBrowser -OfficeHome "$env:RUNNER_TEMP/launcher-home" -Port 4701 | Out-String
          $out
          $plan = $out | ConvertFrom-Json
          if ($plan.port -ne 4701 -or -not $plan.officeHome -or $plan.setEnv.AGENT_OFFICE_LAUNCHER_LOOP -ne '1') { throw "start-office.ps1 -DryRun gave an unexpected plan" }

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - name: Install Chromium for the repository's playwright-core
        # playwright-core's own CLI, so the browser is the build that version expects (package-lock.json
        # pins it); --with-deps adds the system libraries it needs on the runner.
        run: |
          npx --no-install playwright-core --version
          npx --no-install playwright-core install --with-deps chromium

      - name: Check that the browser launches (blocks the guard if it can't)
        # The same Chromium the guard uses (scripts/perf/pages.mjs findChrome: the full browser, not the headless shell).
        run: |
          node --input-type=module -e "
            import { chromium } from 'playwright-core';
            import { findChrome } from './scripts/perf/pages.mjs';
            const exe = findChrome();
            if (!exe) { console.error('BLOCKED: no Chromium from playwright-core install, so the performance guard cannot run'); process.exit(1); }
            try {
              const b = await chromium.launch({ headless: true, executablePath: exe });
              console.log('Chromium', b.version(), 'launches from', exe);
              await b.close();
            } catch (e) {
              console.error('BLOCKED: headless Chromium did not launch, so the performance guard cannot run:', e.message);
              process.exit(1);
            }
          " browser-check

      - name: Performance guard (quick)
        env:
          # The guard's throwaway test offices, and its results under results/<run id>/.
          AGENT_OFFICE_TEST_OFFICES: ${{ runner.temp }}/test-offices
        run: |
          mkdir -p "$AGENT_OFFICE_TEST_OFFICES"
          npm run test:perf:quick

      - name: Performance guard summary
        if: always()
        env:
          AGENT_OFFICE_TEST_OFFICES: ${{ runner.temp }}/test-offices
        run: |
          shopt -s nullglob
          files=("$AGENT_OFFICE_TEST_OFFICES"/results/*/summary.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "The performance guard wrote no summary (it didn't get as far as running)." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in "$AGENT_OFFICE_TEST_OFFICES"/results/*/result.json; do
            node -e "const r = require(process.argv[1]); console.log((r.ok ? 'PASS' : 'FAIL') + ': ' + r.suite + (r.error ? ' (' + r.error + ')' : '')); for (const x of r.failures ?? []) console.log('  - ' + x);" "$f"
          done

      - name: Upload the performance guard's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-guard-results
          path: |
            ${{ runner.temp }}/test-offices/results/**/result.json
            ${{ runner.temp }}/test-offices/results/**/summary.md
            ${{ runner.temp }}/test-offices/results/**/*.png
          if-no-files-found: warn
          retention-days: 30
