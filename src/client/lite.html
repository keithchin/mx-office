<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1324" />
    <title>Agent Office</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
    <!-- The color theme picked on this browser (ui/colortheme.ts), set before the page is drawn so it never flashes the wrong one. -->
    <script>try{var t=localStorage.getItem("agent-office.color-theme");if(["default","dark","terminal","clean-light","clean-dark","portal-light","portal-dark"].indexOf(t)<0)t=matchMedia("(prefers-color-scheme: dark)").matches?"portal-dark":"portal-light";document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- Mx Office's loading screen (#ao-boot): drawn by the page itself before its code loads, so it shows at once; ui/loading/boot.ts moves it on (bundle, sign-in, socket, office data, first view) and fades it out. The same block is in lite.html, pixel.html, home.html and m.html (tests/loading-screen.test.ts keeps them alike). -->
    <style>
      #ao-boot{--b-bg:#fffaf3;--b-ink:#2b2d42;--b-mute:#7a6f65;--b-acc:#ff8a5b;--b-track:#fff1de;--b-font:'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;--b-r:999px;position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:var(--b-bg);color:var(--b-ink);font-family:var(--b-font);opacity:1;transition:opacity .35s ease}
      html[data-theme=dark] #ao-boot{--b-bg:#191b27;--b-ink:#eeedf7;--b-mute:#a9a6c2;--b-acc:#ff8f63;--b-track:#2b2e43}
      html[data-theme=terminal] #ao-boot{--b-bg:#030603;--b-ink:#33ff66;--b-mute:#22c04f;--b-acc:#66ff99;--b-track:#06240e;--b-font:'Cascadia Mono',ui-monospace,Menlo,Consolas,monospace;--b-r:0}
      html[data-theme=clean-light] #ao-boot{--b-bg:#fff;--b-ink:#1f1f1f;--b-mute:#616161;--b-acc:#005fb8;--b-track:#e5e5e5;--b-font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      html[data-theme=clean-dark] #ao-boot{--b-bg:#1e1e1e;--b-ink:#ccc;--b-mute:#9d9d9d;--b-acc:#0078d4;--b-track:#3c3c3c;--b-font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      html[data-theme=portal-light] #ao-boot{--b-bg:#fff;--b-ink:#2f3646;--b-mute:#6c717c;--b-acc:#146ff4;--b-track:#e7e7e9;--b-font:'Noto Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      html[data-theme=portal-dark] #ao-boot{--b-bg:#0f1625;--b-ink:#e4e7ed;--b-mute:#9ba4b4;--b-acc:#5c9dff;--b-track:#2a3448;--b-font:'Noto Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      #ao-boot[hidden]{display:none}
      #ao-boot.aob-out{opacity:0;pointer-events:none}
      #ao-boot .aob-card{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(360px,100%);text-align:center}
      #ao-boot .aob-spin{width:34px;height:34px;border:4px solid var(--b-track);border-top-color:var(--b-acc);border-radius:50%;animation:aob-spin .9s linear infinite}
      html[data-theme=terminal] #ao-boot .aob-spin{border-radius:0}
      #ao-boot .aob-title{margin:0;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
      #ao-boot .aob-bar{width:100%;height:6px;border-radius:var(--b-r);background:var(--b-track);overflow:hidden}
      html[data-theme^=clean] #ao-boot .aob-bar,html[data-theme^=portal] #ao-boot .aob-bar{height:3px}
      #ao-boot .aob-bar i{display:block;width:0;height:100%;background:var(--b-acc);transition:width .3s ease}
      #ao-boot .aob-step{margin:0;min-height:1.3em;color:var(--b-mute);font-size:13px}
      #ao-boot .aob-t-restart,#ao-boot.aob-restart .aob-t-load{display:none}
      #ao-boot.aob-restart .aob-t-restart{display:inline}
      #ao-boot.aob-restart .aob-bar i{width:30%!important;animation:aob-slide 1.4s ease-in-out infinite}
      @keyframes aob-spin{to{transform:rotate(360deg)}}
      @keyframes aob-slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
      @media (prefers-reduced-motion:reduce){#ao-boot,#ao-boot .aob-bar i{transition:none}#ao-boot .aob-spin{animation:none;border-right-color:var(--b-acc)}#ao-boot.aob-restart .aob-bar i{animation:none}}
    </style>
  </head>
  <body class="lite">
    <div id="ao-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="aob-card">
        <div class="aob-spin" aria-hidden="true"></div>
        <p class="aob-title"><span class="aob-t-load">Loading Mx Office… <span class="aob-pct">0</span> %</span><span class="aob-t-restart">Mx Office is restarting… reconnecting</span></p>
        <div class="aob-bar" role="progressbar" aria-label="Loading Mx Office" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <p class="aob-step">Loading the page…</p>
      </div>
    </div>
    <script>(function(){var S=["bundle","session","socket","data","view"],L={bundle:"Loading the page…",session:"Checking your sign-in…",socket:"Connecting to the office…",data:"Getting the office’s data…",view:"Drawing the page…"},d={},el=document.getElementById("ao-boot"),gone=0,downT,polling=0;function q(s){return el.querySelector(s)}function draw(){var n=0,nx,i;for(i=0;i<S.length;i++){if(d[S[i]])n++;else if(!nx)nx=S[i]}var p=Math.floor(n/S.length*100);q(".aob-pct").textContent=p;q(".aob-bar").setAttribute("aria-valuenow",p);q(".aob-bar i").style.width=p+"%";if(!el.classList.contains("aob-restart"))q(".aob-step").textContent=nx?L[nx]:""}function restart(on){el.classList.toggle("aob-restart",!!on);if(on)q(".aob-step").textContent="Trying again every few seconds…";else draw()}function show(){gone=0;el.hidden=false;el.classList.remove("aob-out");el.setAttribute("aria-busy","true")}function hide(){gone=1;el.classList.add("aob-out");el.removeAttribute("aria-busy");setTimeout(function(){if(gone)el.hidden=true},400)}function poll(){if(polling)return;polling=1;(function go(){fetch("/api/health",{cache:"no-store"}).then(function(r){if(r.ok)location.reload();else setTimeout(go,1500)},function(){setTimeout(go,1500)})})()}window.__aoBoot={step:function(s){if(s==="socket")clearTimeout(downT);if(d[s])return;d[s]=1;if(s!=="bundle"&&s!=="session")restart(0);draw();if(s==="view")hide()},down:function(){if(!gone){if(d.bundle)restart(1);return}clearTimeout(downT);downT=setTimeout(function(){d.socket=d.data=d.view=0;show();restart(1)},2000)},shown:function(){return!gone}};addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT"&&!d.bundle){restart(1);poll()}},true);setTimeout(function(){if(d.bundle)return;fetch("/api/health",{cache:"no-store"}).then(function(r){if(!r.ok){restart(1);poll()}else if(!d.bundle)q(".aob-step").textContent="Still loading… (a slow connection)"},function(){restart(1);poll()})},12000)})()</script>
    <!-- The 1D view (lite.ts): the office without the 3D, for a phone or a computer the 3D is too much for. -->
    <header class="lite-bar">
      <a id="to-home" class="btn" href="/home" title="Home: every project, and the office's statistics" aria-label="Home">🏠</a>
      <label class="lite-floor" title="The floor you're on: pick another to see its workers">
        <span class="lite-floor-label">Floor</span>
        <select id="floor" aria-label="Floor"></select>
      </label>
      <!-- Go to Office: the project's 2D office (ui/viewpick.ts viewButton). -->
      <div id="view-pick"></div>
      <button id="theme" class="btn lite-theme" type="button" title="Color theme" aria-label="Color theme">🎨</button>
      <button id="menu" class="btn lite-menu" type="button" title="Menu: everything the 3D office's ☰ has" aria-label="Menu">☰</button>
    </header>
    <main class="lite-main">
      <p id="floor-meta" class="lite-meta"></p>
      <!-- The project's progress: its toolkit stages, Handover and Accepted, measured, the same on every tab (ui/progress/). -->
      <div id="progress-bar"></div>
      <div class="lite-tabs" role="tablist">
        <button id="tab-command" class="btn" type="button" role="tab" title="The project at a glance: what's happening, the project console (the Project Coordinator and the escalations to you), recent activity">🎛️ Command Center <span class="ro-tab-n ny-tab-n"></span></button>
        <button id="tab-board" class="btn" type="button" role="tab" title="The kanban board">🗂 Board</button>
        <button id="tab-workers" class="btn" type="button" role="tab">🤖 Agents</button>
        <button id="tab-analysis" class="btn" type="button" role="tab">📊 Analysis</button>
        <button id="tab-live" class="btn" type="button" role="tab">🌐 Live app</button>
        <button id="tab-git" class="btn" type="button" role="tab" title="The branches as a metro map: who's on which, how far ahead and behind, and their PRs">🌳 Git</button>
        <button id="tab-model" class="btn" type="button" role="tab" title="The app as Studio Pro shows it: the App Explorer, domain models and microflows, on main or any branch, and what a branch changed">📐 Model</button>
        <button id="tab-org" class="btn" type="button" role="tab" title="The project team: the Project Coordinator and the four Leads">🏢 Org chart</button>
        <button id="tab-standup" class="btn" type="button" role="tab" title="The latest standup, and running one">📋 Standup</button>
        <button id="tab-approvals" class="btn" type="button" role="tab" title="What needs the Project Manager: proposals and escalations">✅ Approvals <span class="ro-tab-n"></span></button>
        <button id="tab-settings" class="btn" type="button" role="tab" title="Every setting: you, the workers, the team, Jeff, notifications, the budget, connections, incidents, Studio, the look and the rest">⚙️ Settings</button>
        <button id="tab-teams" class="btn" type="button" role="tab" title="A board per team: its own cards, Lead, panels and journal (the org chart is on 👥 Team)">🧩 Team boards</button>
        <button id="tab-budget" class="btn" type="button" role="tab" title="What the project has spent, against its budget: by stage, role, agent, model, day and issue">💰 Budget</button>
        <button id="tab-audit" class="btn" type="button" role="tab" title="Who did what, when: hires, prompts, escalations, approvals, GitHub, settings and sign-ins">🧾 Audit log</button>
      </div>
      <!-- Other floors where someone's waiting (shared/floors.ts), below the tabs so the tab bar stays put; the Command Center lists them in Needs you instead (ui/needsyou/needsyou.css). -->
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <!-- What's blocked on you right now, a button to each fix, on the Command Center (ui/needsyou/). -->
      <div id="needs-you"></div>
      <!-- A toolkit project's stages until its build plan is confirmed (ui/setup-panel.ts). -->
      <div id="setup"></div>
      <!-- What's happening on the floor, in a few sentences and numbers (ui/summary.ts). -->
      <div id="summary"></div>
      <!-- The pipeline from issue to merged PR, agents in between (ui/kanban.ts). -->
      <div id="board" class="kb"></div>
      <!-- Which model does well on what, here or on every floor (ui/analysis.ts). -->
      <div id="analysis-view" class="hidden"></div>
      <!-- The floor's app, running from main, in a frame (ui/liveapp.ts). -->
      <div id="liveapp-view" class="hidden"></div>
      <!-- The branches as a metro map (ui/git/). -->
      <div id="git-view" class="hidden"></div>
      <!-- The Mendix app as Studio Pro shows it: App Explorer, domain models, microflows (ui/model/). -->
      <div id="model-view" class="hidden"></div>
      <!-- The project team: org chart, standup and approvals (ui/roster/); its settings are ⚙️ Settings › Team. -->
      <div id="team-view" class="hidden"></div>
      <!-- A page per team: its board, its Lead, its panels and its journal (ui/teams/). -->
      <div id="teams-view" class="hidden"></div>
      <!-- The Firm, on the Audit log page: its audit of this project running, its report ready, or Call an audit and The Firm → (ui/firm/banner.ts). -->
      <div id="firm-banner" class="hidden"></div>
      <!-- Who did what, when (ui/audit/). -->
      <div id="audit-view" class="hidden"></div>
      <!-- ⚙️ Settings: every setting, a section at a time (ui/settings/page.ts). -->
      <div id="settings-view" class="hidden"></div>
      <!-- What the project has spent, against its budget (ui/budget/). -->
      <div id="budget-view" class="hidden"></div>
      <!-- 🧪 Test mode: the suites, their runs and results (ui/testlab/); admins only, from the ☰, the home page and ⚙️ Settings › Testing. -->
      <div id="tests-view" class="hidden"></div>
      <div id="workers-view">
        <h2 class="lite-h">Agents <span id="waiting-now" class="lite-waiting"></span></h2>
        <ul id="workers" class="lite-workers"></ul>
      </div>
    </main>
    <nav id="lite-nav" class="lite-nav" aria-label="Office">
      <button id="btn-issues" class="btn" type="button">📌 Issues <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button">🔀 PRs <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button">📋 Queue <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button">✨ New task</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
