<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1828" />
    <title>Agent Office</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./pixel.css" />
  </head>
  <body class="lite pixel">
    <!-- The 2D view (pixel.ts): the floor from above in pixel art, every worker at its desk. -->
    <header class="lite-bar">
      <button id="to-home" class="btn" type="button" title="Every floor of the building, and adding a project" aria-label="Floors">🏠</button>
      <label class="lite-floor" title="The floor you're on: pick another to see its office">
        <span class="lite-floor-label">Floor</span>
        <select id="floor" aria-label="Floor"></select>
      </label>
      <p id="floor-meta" class="px-meta"></p>
      <nav class="lite-views" aria-label="View">
        <button id="to-1d" class="btn" type="button" title="The 1D view: the floor's board and its workers"><span class="ico">🗂️</span> 1D</button>
        <button class="btn on" type="button" aria-current="page" title="The 2D view: the floor from above in pixel art">
          <span class="ico">🗺️</span> 2D
        </button>
        <a id="to-3d" class="btn" href="/?3d=1&amp;view=3d" title="The 3D office, where you walk around"><span class="ico">🏢</span> 3D</a>
        <a id="to-retro" class="btn" href="/?3d=1&amp;view=retro" title="The office in chunky 16-bit pixels, where you walk around"><span class="ico">👾</span> Retro</a>
      </nav>
    </header>
    <!-- Every floor of the building, to go into, and adding one (shared/floors.ts). -->
    <section id="home" class="home hidden" aria-label="Floors"></section>
    <main id="stage" class="px-stage">
      <canvas id="office" aria-label="The office from above: click someone for their terminal, or a free desk to give someone new work there"></canvas>
      <div id="px-tip" class="px-tip hidden" role="tooltip"></div>
      <div id="elsewhere" class="px-elsewhere hidden"></div>
    </main>
    <!-- Who's doing what on this floor, and what the colors mean. -->
    <footer id="px-foot" class="px-foot">
      <span id="px-count" class="px-count"></span>
      <span class="px-legend" aria-hidden="true">
        <span><i style="background: #5fd9cb"></i>working</span><span><i style="background: #f2b33d"></i>needs you</span><span><i style="background: #2fbf8a"></i>done</span><span><i style="background: #8fa3bf"></i>asleep</span>
      </span>
    </footer>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting…</div>
    <div id="modal-root"></div>
    <script type="module" src="./pixel.ts"></script>
  </body>
</html>
